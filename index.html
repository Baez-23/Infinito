<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinito ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="cosmos">
    <canvas id="space"></canvas>

    <div id="startOverlay" class="start-overlay">
      <button id="startBtn" class="start-btn" aria-label="Iniciar viaje">
        <span class="star-pulse">✦</span>
        <span class="start-label">Toca para comenzar</span>
      </button>
    </div>

    <audio id="bgMusic" src="musica.mp3" preload="auto" loop></audio>
  </main>

  <script src="index.js"></script>
</body>
</html>
